name: Build UU-status (Details + Page)

on:
  schedule:
    - cron: "27 1 * * *"   # daglig 01:27 UTC
  workflow_dispatch:

# Ingen tilgang som standard. Hver jobb ber om det den trenger, og ingenting
# mer. Sto tidligere «contents: write» her, og da gjaldt skrivetilgangen hvert
# eneste steg i hver jobb – også pip-installasjonen, som kjører tredjepartskode.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Trengs for å pushe datacommiten i siste steg.
    permissions:
      contents: write
    outputs:
      endret: ${{ steps.commit.outputs.endret }}

    steps:
      # Actions er pinnet til commit-SHA, ikke tagg. En tagg kan flyttes til
      # en annen commit av den som eier repoet; en SHA kan ikke. Kommentaren
      # bak sier hvilken versjon SHA-en tilsvarer, så oppgradering er sporbar.
      - name: Check out repo (full historikk + behold filer)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0       # henter hele historikken (nødvendig for baseline)
          ref: main
          fetch-tags: true
          clean: false         # behold eksisterende filer (f.eks. docs/latest.json)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --require-hashes: pip avbryter hvis innholdet i en pakke avviker
          # fra hashen i requirements.txt. --no-deps fordi alle indirekte
          # avhengigheter allerede står der eksplisitt, med egen hash.
          pip install --require-hashes --no-deps -r requirements.txt

      - name: Build source mirrors (alle erklaeringer + Skatteetaten m/ resultat)
        run: |
          python build_benchmark_source.py

      - name: Build details from dataset (WCAG-koder fra resultat-arrayet)
        run: |
          python enrich_uu_details.py

      - name: Ensure archive folders & seed files
        run: |
          mkdir -p docs/data/uustatus/snapshots_by_updated
          mkdir -p docs/data/uustatus/snapshots
          mkdir -p docs/data/uustatus/logs
          [ -f docs/data/uustatus/latest.json ] || echo '{ "urls": [] }' > docs/data/uustatus/latest.json
          [ -f docs/data/uustatus/logs/changes.jsonl ] || : > docs/data/uustatus/logs/changes.jsonl

      - name: Sanity summary (codes present in details)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/uu-status-details.json").read_text(encoding="utf-8"))
          rows = data.get("urls") if isinstance(data, dict) else data
          with_codes = sum(1 for r in rows if r.get("nonConformities"))
          print(f"details.json entries: {len(rows)} | with codes: {with_codes}")
          PY

      - name: Inspect HEAD baseline (light)
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "HEAD  : $(git rev-parse HEAD)"
          if git ls-tree -r --name-only HEAD | grep -q '^docs/data/uustatus/latest.json$'; then
            echo "✓ Filen finnes i HEAD"
            echo "Filstørrelse i HEAD:"
            git show HEAD:docs/data/uustatus/latest.json | wc -c || echo "Kunne ikke lese filstørrelse"
            echo "Første 200 tegn i filen:"
            git show HEAD:docs/data/uustatus/latest.json 2>&1 | head -c 200 || echo "Kunne ikke lese innhold"
            echo ""
            echo "baseline url count (HEAD):"
          else
            echo "✗ Filen finnes IKKE i HEAD"
            echo "baseline url count (HEAD): 0 (filen mangler)"
          fi
          python - <<'PY'
          import sys, json, subprocess
          try:
              result = subprocess.run(
                  ["git", "show", "HEAD:docs/data/uustatus/latest.json"],
                  capture_output=True,
                  text=True,
                  check=True
              )
              content = result.stdout
              if not content.strip():
                  print("0 (filen er tom)")
                  sys.exit(0)
              j=json.loads(content)
              urls=j["urls"] if isinstance(j,dict) else j
              if isinstance(urls, list):
                  print(len(urls))
              else:
                  print(f"0 (urls er ikke en liste, type: {type(urls).__name__})")
          except subprocess.CalledProcessError as e:
              print(f"0 (git show feilet: {e.stderr.strip()})")
          except json.JSONDecodeError as e:
              print(f"0 (JSON-feil: {e})")
          except Exception as e:
              print(f"0 (feil: {type(e).__name__}: {e})")
          PY

      # Kjøres før arkivsteget, ikke etter. Feilene disse testene dekker er
      # stille – de kaster ikke unntak, de skriver bare gale rader. Stopper vi
      # her, er changes.jsonl fortsatt intakt og neste kjøring kan prøve igjen.
      - name: Regresjonstester for arkivet
        run: |
          python test_arkiv.py

      - name: Build archive (diff & event snapshots)
        env:
          AUTO_BACKTRACK: "1"
          MAX_BACKTRACK: "20"
        run: |
          python build_uu_archive.py

      - name: Commit updated details and page (if changed)
        id: commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "endret=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update UU-status + archive (details, page, snapshots, changes)"
            git pull --rebase
            git push
            echo "endret=true" >> "$GITHUB_OUTPUT"
          fi

  # Push gjort med GITHUB_TOKEN trigger ikke push-workflows. Uten dette kallet
  # ville pages.yml aldri kjørt etter en nattlig datauppdatering, og den
  # publiserte siden ville blitt stående med gamle tall.
  publiser:
    needs: build
    if: needs.build.outputs.endret == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
