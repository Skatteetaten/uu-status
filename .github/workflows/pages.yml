name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.mts"
      - "vitest.config.mts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Kalles av uu-status.yml etter den nattlige dataoppdateringen. Nødvendig
  # fordi push gjort med GITHUB_TOKEN ikke trigger andre workflows – uten dette
  # ville siden aldri blitt bygget om med ferske data.
  workflow_call:

# Ingen tilgang som standard; begge jobbene ber om sitt eget. Ikke fordi noe
# er utrygt i dag – jobbene setter allerede sine egne – men fordi en jobb som
# legges til senere uten å tenke på tilganger da får ingenting, ikke alt.
permissions: {}

# Én publisering om gangen. Vi avbryter ikke pågående kjøringer: en halvferdig
# deploy er verre enn å vente.
concurrency:
  group: pages
  cancel-in-progress: false

# Delt i to jobber med vilje.
#
# En Actions-runner laster ned ALLE actions i en jobb før første steg kjøres.
# Ligger bygg og publisering i samme jobb, må fire actions hentes ned før noe
# skjer – og feiler én av dem, kastes hele byggingen.
#
# Med to jobber henter publiseringssteget bare deploy-pages. Feiler det, kan
# man kjøre den ene jobben på nytt uten å bygge om, og bare én nedlasting må
# lykkes. Det ble aktuelt 2026-08-17, da GitHub hadde 50 % feilrate på
# arkivnedlastinger og publiseringen feilet tre ganger på rad.
#
# Dette er også strukturen i GitHubs egen mal for Pages.
jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Se uu-status.yml: pinnet til commit-SHA, ikke tagg. Tagger kan flyttes.
      #
      # ref: main er nødvendig, ikke pynt. Uten den sjekker actions/checkout ut
      # github.sha – commiten som utløste kjøringen. Når uu-status.yml kaller
      # denne workflowen, er det commiten fra FØR nattens datacommit, og siden
      # ble bygget med gårsdagens data. Den lå dermed permanent ett døgn bak
      # repoet: 20. august publiserte vi 118 erklæringer mens repoet hadde 119.
      # commit-jobben har allerede pushet når vi kommer hit, så main er fersk.
      - name: Sjekk ut repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Sett opp Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer avhengigheter
        run: npm ci

      # Blant annet at abonnementsinngangen IKKE rendres: funksjonsbryteren
      # skal stå av til SharePoint-skjemaet finnes, og testene fryser det.
      #
      # continue-on-error på den nattlige kjøringen, med vilje: UU-portalen
      # leser details.json live fra Pages, og en frontendtest som knekker av
      # en urelatert årsak (f.eks. en avhengighetsoppdatering) skal ikke holde
      # ferske erklæringsdata tilbake. Push fra utviklere gates fortsatt hardt
      # – det er der testfeil faktisk skyldes endringen som pushes.
      # (workflow_call arver utløserens event_name, så nattjobben er schedule.)
      - name: Frontendtester
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: npm test

      - name: Bygg (typecheck + vite)
        run: npm run build

      - name: Kontroller at kontrakten mot UU-portalen holder
        run: |
          set -e
          # UU-portalen henter denne fila direkte fra Pages. Ligger den ikke i
          # rota av artefakten, knekker portalen uten at noe annet feiler.
          test -f dist/uu-status-details.json
          node -e "
            const d = JSON.parse(require('fs').readFileSync('dist/uu-status-details.json','utf8'));
            if (!Array.isArray(d) || d.length === 0) throw new Error('details.json er tom eller ikke en liste');
            const felt = ['nonConformities','codes','totalNonConformities','updatedAt','opprettet'];
            const mangler = felt.filter(f => !(f in d[0]));
            if (mangler.length) throw new Error('Mangler felt: ' + mangler.join(', '));
            console.log('OK: ' + d.length + ' erklæringer, alle kontraktsfelt til stede');
          "
          # Power Automate henter katalogen og feedene fra Pages – mangler de
          # i artefakten, stopper synkroniseringen stille. Se ABONNEMENT.md.
          test -f dist/data/subscriptions/declarations.json
          test -f dist/feeds/uu-catalog.xml
          test -f dist/feeds/uu-events.xml
          echo "OK: abonnementskatalog og feeds er med i artefakten"
          # Interne SharePoint-sider bygger inn denne i en iframe. Faller
          # den ut av bygget, viser webdelen bare en tom ramme.
          test -f dist/noekkeltall.html
          echo "OK: innbyggbar nøkkeltallside er med i artefakten"

      # actions/configure-pages er bevisst utelatt. Den finnes for å gi
      # base_path og origin til rammeverk som trenger dem – vi setter base
      # selv i vite.config.mts og bruker ingen av utdataene. Pages-kilden er
      # allerede satt til GitHub Actions, så den hadde ingen jobb å gjøre.
      - name: Last opp artefakt
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publiser
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
