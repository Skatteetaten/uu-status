<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endringsarkiv – UU-status</title>
    <!--
      Endringsarkivet er nå en fane på forsiden. Fila blir liggende fordi
      URL-en er offentlig – den skal ikke gi 404.

      Umiddelbar meta-refresh (0 sekunder) er tillatt etter WCAG; det er
      forsinkede omdirigeringer som bryter 2.2.1. GitHub Pages kan ikke gjøre
      omdirigering på tjenersiden. Den synlige lenken fanger opp tilfeller der
      refresh er blokkert.
    -->
    <meta http-equiv="refresh" content="0; url=index.html#endringsarkiv" />
  </head>
  <body>
    <p>
      Endringsarkivet ligger nå som en fane på forsiden.
      <a href="index.html#endringsarkiv">Gå til endringsarkivet</a>
    </p>
  </body>
</html>
